      x-permissions:
        - DASHBOARD_READ
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PORTALSESSION
      description: Opaque server-side session cookie.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF token required for unsafe same-origin requests.
  headers:
    XRateLimitLimit:
      description: Maximum requests allowed in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Remaining requests in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: UTC epoch seconds when the current rate-limit window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying after a rate limit response.
      schema:
        type: integer
        minimum: 0
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      description: Sort expression such as `createdAt,desc`. Repeat for multiple fields.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    FactorId:
      name: factorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    UserActionRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserActionRequest"
  responses:
    BadRequest:
      description: Malformed request syntax, invalid parameter shape, or unreadable body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Missing, expired, or invalid authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated principal lacks the required permission or CSRF token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Request is syntactically valid but violates validation rules.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/XRateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/XRateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/XRateLimitReset"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UserActionCompleted:
      description: User action completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionResult"
    UserActionAccepted:
      description: User action accepted for asynchronous processing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionResult"
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 problem details object.
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable application error code.
        traceId:
          type: string
          description: Correlation identifier for diagnostics.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
    PageRequest:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 0
          default: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        sort:
          type: array
          items:
            type: string
    PageResponse:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - totalElements
        - totalPages
        - numberOfElements
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        numberOfElements:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - LOCKED
        - PENDING
    Language:
      type: string
      enum:
        - fa-IR
        - en-US
    Theme:
      type: string
      enum:
        - LIGHT
        - DARK
        - SYSTEM
    Preferences:
      type: object
      additionalProperties: false
      required:
        - language
        - theme
        - timezone
      properties:
        language:
          $ref: "#/components/schemas/Language"
        theme:
          $ref: "#/components/schemas/Theme"
        timezone:
          type: string
          example: Asia/Tehran
        density:
          type: string
          enum:
            - COMFORTABLE
            - COMPACT
          default: COMFORTABLE
    Permission:
      type: object
      additionalProperties: false
      required:
        - code
        - module
        - action
        - description
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          example: USER_READ
        module:
          type: string
          example: users
        action:
          type: string
          example: read
        description:
          type: string
        system:
          type: boolean
          default: true
    Role:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - system
        - permissions
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          example: ADMIN
        name:
          type: string
        description:
          type:
            - string
            - "null"
        system:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - displayName
        - status
        - preferences
        - roles
        - permissions
        - mfaEnabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        status:
          $ref: "#/components/schemas/UserStatus"
        preferences:
          $ref: "#/components/schemas/Preferences"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
            pattern: "^[A-Z0-9_]+$"
        mfaEnabled:
          type: boolean
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - createdAt
        - lastAccessedAt
        - expiresAt
        - current
      properties:
        id:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastAccessedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        current:
          type: boolean
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actor
        - action
        - resource
        - outcome
        - hash
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/AuditActor"
        action:
          type: string
          example: USER_UPDATED
        resource:
          $ref: "#/components/schemas/AuditResource"
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        ipAddress:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        previousHash:
          type:
            - string
            - "null"
        hash:
          type: string
    AuditActor:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - USER
            - SYSTEM
            - SERVICE
        userId:
          type:
            - string
            - "null"
          format: uuid
        username:
          type:
            - string
            - "null"
    AuditResource:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          example: USER
        id:
          type:
            - string
            - "null"
        displayName:
          type:
            - string
            - "null"
    SecurityEventSeverity:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
    SecurityEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - type
        - severity
        - acknowledged
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
          example: AUTH_BRUTE_FORCE_DETECTED
        severity:
          $ref: "#/components/schemas/SecurityEventSeverity"
        userId:
          type:
            - string
            - "null"
          format: uuid
        ipAddress:
          type: string
        details:
          type: object
          additionalProperties: true
        acknowledged:
          type: boolean
        acknowledgedBy:
          type:
            - string
            - "null"
          format: uuid
        acknowledgedAt:
          type:
            - string
            - "null"
          format: date-time
        acknowledgementNote:
          type:
            - string
            - "null"
    MfaFactor:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - enabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - TOTP
        name:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
    MfaSetup:
      type: object
      additionalProperties: false
      required:
        - factorId
        - type
        - secret
        - otpAuthUri
        - expiresAt
      properties:
        factorId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - TOTP
        secret:
          type: string
          description: Base32-encoded TOTP seed shown only during setup.
        otpAuthUri:
          type: string
          format: uri
        qrCodeSvg:
          type: string
          description: Optional SVG QR code data.
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        rememberDevice:
          type: boolean
          default: false
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - AUTHENTICATED
            - MFA_REQUIRED
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        mfaChallenge:
          $ref: "#/components/schemas/MfaChallenge"
    MfaChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - methods
        - expiresAt
      properties:
        challengeId:
          type: string
        methods:
          type: array
          items:
            type: string
            enum:
              - TOTP
              - RECOVERY_CODE
        expiresAt:
          type: string
          format: date-time
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 12
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 8
        rememberDevice:
          type: boolean
          default: false
    MfaRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - recoveryCode
      properties:
        challengeId:
          type: string
        recoveryCode:
          type: string
        rememberDevice:
          type: boolean
          default: false
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - headerName
        - token
      properties:
        headerName:
          type: string
          const: X-XSRF-TOKEN
        token:
          type: string
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
    PreferencesPatchRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
        theme:
          $ref: "#/components/schemas/Theme"
        timezone:
          type: string
        density:
          type: string
          enum:
            - COMFORTABLE
            - COMPACT
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
    MfaSetupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          default: Authenticator app
    MfaConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - factorId
        - code
      properties:
        factorId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 6
          maxLength: 8
    MfaEnrollmentResult:
      type: object
      additionalProperties: false
      required:
        - factor
        - recoveryCodes
      properties:
        factor:
          $ref: "#/components/schemas/MfaFactor"
        recoveryCodes:
          type: array
          items:
            type: string
    RecoveryCodeStatus:
      type: object
      additionalProperties: false
      required:
        - remainingCodes
      properties:
        remainingCodes:
          type: integer
          minimum: 0
        lastRegeneratedAt:
          type:
            - string
            - "null"
          format: date-time
    RecoveryCodes:
      type: object
      additionalProperties: false
      required:
        - recoveryCodes
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    PasswordConfirmationRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - displayName
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        sendInvite:
          type: boolean
          default: true
        preferences:
          $ref: "#/components/schemas/Preferences"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        status:
          $ref: "#/components/schemas/UserStatus"
        preferences:
          $ref: "#/components/schemas/PreferencesPatchRequest"
    UserActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
        notifyUser:
          type: boolean
          default: false
    AssignRolesRequest:
      type: object
      additionalProperties: false
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    RoleWriteRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
    RolePatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - "null"
          maxLength: 500
    AssignPermissionsRequest:
      type: object
      additionalProperties: false
      required:
        - permissionCodes
      properties:
        permissionCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z0-9_]+$"
    PermissionMatrix:
      type: object
      additionalProperties: false
      required:
        - roles
        - permissions
        - assignments
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - roleId
              - permissionCode
            properties:
              roleId:
                type: string
                format: uuid
              permissionCode:
                type: string
                pattern: "^[A-Z0-9_]+$"
    ActionResult:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        id:
          type: string
        completedAt:
          type: string
          format: date-time
    SessionRevocationResult:
      type: object
      additionalProperties: false
      required:
        - revokedCount
      properties:
        revokedCount:
          type: integer
          minimum: 0
    AuditExportRequest:
      type: object
      additionalProperties: false
      required:
        - format
      properties:
        format:
          type: string
          enum:
            - CSV
            - JSON
        filters:
          type: object
          additionalProperties: true
    ExportJob:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - requestedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
        requestedAt:
          type: string
          format: date-time
    AuditIntegrityRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditIntegrityResult:
      type: object
      additionalProperties: false
      required:
        - valid
        - checkedEvents
      properties:
        valid:
          type: boolean
        checkedEvents:
          type: integer
          minimum: 0
        firstInvalidEventId:
          type:
            - string
            - "null"
          format: uuid
        verifiedAt:
          type: string
          format: date-time
    AcknowledgeSecurityEventRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
    Settings:
      type: object
      additionalProperties: false
      required:
        - defaultLanguage
        - defaultTheme
        - sessionTimeoutMinutes
        - mfaRequiredForAdmins
        - auditRetentionDays
      properties:
        defaultLanguage:
          $ref: "#/components/schemas/Language"
        defaultTheme:
          $ref: "#/components/schemas/Theme"
        sessionTimeoutMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        mfaRequiredForAdmins:
          type: boolean
        auditRetentionDays:
          type: integer
          minimum: 30
        loginRateLimitPerMinute:
          type: integer
          minimum: 1
    SettingsPatchRequest:
      type: object
      additionalProperties: false
      properties:
        defaultLanguage:
          $ref: "#/components/schemas/Language"
        defaultTheme:
          $ref: "#/components/schemas/Theme"
        sessionTimeoutMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        mfaRequiredForAdmins:
          type: boolean
        auditRetentionDays:
          type: integer
          minimum: 30
        loginRateLimitPerMinute:
          type: integer
          minimum: 1
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - activeUsers
        - activeSessions
        - securityEvents
        - auditEventsToday
      properties:
        activeUsers:
          type: integer
          minimum: 0
        activeSessions:
          type: integer
          minimum: 0
        securityEvents:
          type: object
          additionalProperties: false
          required:
            - unacknowledged
            - critical
          properties:
            unacknowledged:
              type: integer
              minimum: 0
            critical:
              type: integer
              minimum: 0
        auditEventsToday:
          type: integer
          minimum: 0
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          additionalProperties: false
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/User"
    RolePage:
      allOf:
        - $ref: "#/components/schemas/PageResponse"
        - type: object
          additionalProperties: false
          required:
