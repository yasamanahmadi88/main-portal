openapi: 3.1.0
info:
  title: Enterprise Portal API
  version: 1.0.0
  summary: Contract-first API for the enterprise portal BFF.
  description: |
    Enterprise Portal API v1 is served under `/api/v1` and uses same-origin,
    cookie-backed sessions with CSRF protection for unsafe requests.

    Rate limiting is documented with `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset`, and `Retry-After` response
    headers. Unless otherwise specified, operations may return the standard
    Problem Details responses defined in `components.responses` for 400, 401,
    403, 404, 409, 422, 429, and 500.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Authentication, CSRF, password recovery, and login MFA.
  - name: Me
    description: Self-service profile, preferences, sessions, and MFA.
  - name: Users
    description: Administrative user management.
  - name: Roles
    description: Role lifecycle and role permission assignment.
  - name: Permissions
    description: Permission catalog and matrix views.
  - name: Sessions
    description: Administrative session management.
  - name: Audit
    description: Audit event search, export, and integrity verification.
  - name: SecurityEvents
    description: Security event monitoring and acknowledgement.
  - name: Settings
    description: Tenant and system settings.
  - name: Dashboard
    description: Portal dashboard summaries.
x-standard-error-responses:
  "400": "#/components/responses/BadRequest"
  "401": "#/components/responses/Unauthorized"
  "403": "#/components/responses/Forbidden"
  "404": "#/components/responses/NotFound"
  "409": "#/components/responses/Conflict"
  "422": "#/components/responses/UnprocessableEntity"
  "429": "#/components/responses/TooManyRequests"
  "500": "#/components/responses/InternalServerError"
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Authenticate with username and password.
      description: Creates a server-side session or returns an MFA challenge when additional verification is required.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login completed or MFA challenge issued.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Terminate the current session.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: Current session revoked.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/password/forgot:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Request a password reset.
      description: Always returns an accepted response to avoid account enumeration.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Password reset request accepted.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/password/reset:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: Complete a password reset with a reset token.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset completed.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/mfa/verify:
    post:
      tags:
        - Auth
      operationId: verifyLoginMfa
      summary: Verify MFA during login.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA verification succeeded and a session was established.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/mfa/recovery:
    post:
      tags:
        - Auth
      operationId: verifyLoginRecoveryCode
      summary: Verify a recovery code during login.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRecoveryRequest"
      responses:
        "200":
          description: Recovery code accepted and a session was established.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/csrf:
    get:
      tags:
        - Auth
      operationId: getCsrfToken
      summary: Return the current CSRF token.
      description: Issues or refreshes the CSRF token used in `X-XSRF-TOKEN` for unsafe requests.
      security: []
      responses:
        "200":
          description: Current CSRF token.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me:
    get:
      tags:
        - Me
      operationId: getCurrentUser
      summary: Get the authenticated user's profile.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Me
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/preferences:
    get:
      tags:
        - Me
      operationId: getMyPreferences
      summary: Get current user preferences.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Me
      operationId: updateMyPreferences
      summary: Update current user preferences.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatchRequest"
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/password:
    post:
      tags:
        - Me
      operationId: changeMyPassword
      summary: Change the current user's password.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/sessions:
    get:
      tags:
        - Me
      operationId: listMySessions
      summary: List current user's active sessions.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Current user's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/sessions/{sessionId}:
    delete:
      tags:
        - Me
      operationId: revokeMySession
      summary: Revoke one of the current user's sessions.
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/sessions/revoke-others:
    post:
      tags:
        - Me
      operationId: revokeMyOtherSessions
      summary: Revoke all current-user sessions except the caller's session.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          description: Other sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa:
    get:
      tags:
        - Me
      operationId: listMyMfaFactors
      summary: List current user's MFA factors.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: MFA factor list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MfaFactor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa/totp/setup:
    post:
      tags:
        - Me
      operationId: setupMyTotpMfa
      summary: Start TOTP MFA enrollment.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaSetupRequest"
      responses:
        "201":
          description: TOTP setup material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa/totp/confirm:
    post:
      tags:
        - Me
      operationId: confirmMyTotpMfa
      summary: Confirm TOTP MFA enrollment.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmRequest"
      responses:
        "200":
          description: MFA factor enabled and recovery codes issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa/recovery-codes:
    get:
      tags:
        - Me
      operationId: getMyMfaRecoveryCodeStatus
      summary: Get recovery-code availability for the current user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recovery-code status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa/recovery-codes/regenerate:
    post:
      tags:
        - Me
      operationId: regenerateMyMfaRecoveryCodes
      summary: Regenerate current user's MFA recovery codes.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: New recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me/mfa/{factorId}:
    delete:
      tags:
        - Me
      operationId: deleteMyMfaFactor
      summary: Delete an MFA factor for the current user.
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/FactorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "204":
          description: MFA factor deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: Search and list users.
      x-permissions:
        - USER_READ
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - name: q
          in: query
          description: Search text matched against username, display name, and email.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: User page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Users
      operationId: createUser
      summary: Create a user.
      x-permissions:
        - USER_CREATE
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get a user by ID.
      x-permissions:
        - USER_READ
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user.
      x-permissions:
        - USER_UPDATE
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/users/{userId}/activate:
    post:
      tags:
        - Users
      operationId: activateUser
      summary: Activate a user.
      x-permissions:
        - USER_ACTIVATE
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        $ref: "#/components/requestBodies/UserActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserActionCompleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
