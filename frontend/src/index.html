<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>سامانه پرتال سازمانی | Enterprise Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Enterprise portal for identity, access, and governance." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3055e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="preload"
      href="fonts/vazirmatn/Vazirmatn-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/vazirmatn/Vazirmatn-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Inline theme bootstrap: avoids flash of unstyled/incorrect theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portal.theme');
          var pref = stored ? JSON.parse(stored) : null;
          var mode = pref && pref.mode ? pref.mode : 'SYSTEM';
          var isDark =
            mode === 'DARK' ||
            (mode === 'SYSTEM' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          var lang = localStorage.getItem('portal.lang');
          if (lang === 'en-US') {
            document.documentElement.setAttribute('lang', 'en-US');
            document.documentElement.setAttribute('dir', 'ltr');
          } else {
            document.documentElement.setAttribute('lang', 'fa-IR');
            document.documentElement.setAttribute('dir', 'rtl');
          }
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:Vazirmatn,Segoe UI,Tahoma,sans-serif;color:#5a6478">
        <span>در حال بارگذاری… / Loading…</span>
      </div>
    </app-root>
  </body>
</html>
