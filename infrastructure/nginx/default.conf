# Enterprise Portal vhost.
#
#   /                          → Angular SPA (static assets)
#   /api/                      → Spring Boot backend (session cookie + CSRF)
#   /actuator/health           → Backend readiness (unrestricted; no details)
#   /actuator/                 → Backend management port; internal only
#   /healthz                   → nginx-local liveness for docker/K8s probes
#
# The frontend and backend live at the same origin so browsers never send
# cross-origin cookies and CORS pre-flights are not needed.  A restrictive
# CSP is enforced; the SPA nonce mechanism is unused (Angular emits inline
# style at build time only, which we allow via 'self').

# Backend upstream — the compose service name is `backend`, port 8080 API,
# port 8081 management/actuator.
upstream portal_backend_api {
    zone portal_backend_api 64k;
    keepalive 32;
    server backend:8080 max_fails=3 fail_timeout=10s;
}

upstream portal_backend_mgmt {
    zone portal_backend_mgmt 64k;
    keepalive 8;
    server backend:8081 max_fails=3 fail_timeout=10s;
}

# Trust proxy chains only from private ranges.  In production, tighten this
# to the specific ingress subnet.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Map to normalise the request scheme when running behind a TLS-terminating
# load balancer.  Falls back to the actual scheme when the header is missing.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Rate / connection limits are applied per-location below. Open-source
    # nginx does not support `limit_req off` / `limit_conn off`, so /healthz
    # must omit those directives rather than inherit a server-level limit.

    # -----------------------------------------------------------------
    #  Security headers (applied everywhere via a named location + add_header
    #  inheritance).  See docs/architecture/security-headers.md for rationale.
    # -----------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy     "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    # HSTS: only meaningful when this container is behind HTTPS.  Safe to send
    # regardless because it is ignored over plain HTTP by browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — same-origin only.  `'unsafe-inline'` on style-src covers Angular
    # Material's runtime style injection; scripts remain strictly self.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

    # No wildcard CORS.  Because the SPA and API are same-origin we never
    # emit any Access-Control-* header.  If a real cross-origin caller ever
    # needs API access, add a narrow `map $http_origin` allowlist here.

    # -----------------------------------------------------------------
    #  Local health endpoint (nginx only — not proxied).  Used by the
    #  container HEALTHCHECK.  Rate-limit-exempt.
    # -----------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------
    #  Backend actuator — proxy `/actuator/health` (readiness) only, from
    #  the management port.  All other actuator endpoints are internal.
    # -----------------------------------------------------------------
    location = /actuator/health {
        access_log off;
        proxy_pass         http://portal_backend_mgmt/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header   Connection        "";
    }

    # Block everything else under /actuator.  This is defense-in-depth on top
    # of Spring's own exposure filter.
    location ^~ /actuator/ {
        return 404;
    }

    # -----------------------------------------------------------------
    #  API — reverse proxy to backend:8080.  Cookies stay on `/` so the
    #  session cookie is shared across the SPA + API.
    # -----------------------------------------------------------------
    location ^~ /api/ {
        limit_conn perip 32;
        limit_req  zone=global burst=120 nodelay;

        # Per-endpoint rate limit for authentication.
        location ~* ^/api/v[0-9]+/auth/(login|mfa|password/reset|password/forgot)$ {
            limit_conn perip 32;
            limit_req zone=login burst=20 nodelay;
            include /etc/nginx/conf.d/_api_proxy.inc;
        }

        include /etc/nginx/conf.d/_api_proxy.inc;
    }

    # -----------------------------------------------------------------
    #  Static assets (SPA).  Long-cache immutable fingerprinted files;
    #  everything else has short TTL so deploys are picked up quickly.
    # -----------------------------------------------------------------
    location ~* ^/(favicon\.ico|robots\.txt|manifest\.webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|avif|ico|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -----------------------------------------------------------------
    #  SPA fallback — every unknown path returns index.html so the
    #  Angular router can handle it.  index.html itself must NOT be
    #  cached, otherwise clients pin an old bundle hash.
    # -----------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
        expires -1;
    }

    location / {
        limit_conn perip 32;
        limit_req  zone=global burst=120 nodelay;
        try_files $uri $uri/ /index.html;
        # nginx does not inherit server-level add_header once a location
        # defines its own — restate security headers with Cache-Control.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Permissions-Policy     "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # -----------------------------------------------------------------
    #  Errors
    # -----------------------------------------------------------------
    error_page 404 = /index.html;   # SPA handles unknown routes
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
