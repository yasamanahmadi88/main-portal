# Top-level nginx configuration for the portal frontend container.
# Tuned for a single-container SPA reverse-proxy in front of Spring Boot.

worker_processes auto;
worker_rlimit_nofile 8192;

# Runs under UID 101 (nginx) inside the nginxinc/nginx-unprivileged image, so
# we don't need a `user` directive here.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cache dirs need to be writable — with a read-only rootfs we place them
    # under /tmp which is provided via tmpfs by compose.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # -----------------------------------------------------------------
    #  Performance
    # -----------------------------------------------------------------
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 30s;
    keepalive_requests 500;
    reset_timedout_connection on;
    types_hash_max_size 4096;

    server_tokens off;   # do not leak nginx version

    # -----------------------------------------------------------------
    #  Compression — safe defaults (skip already-compressed types, and
    #  keep gzip off for very small responses / HTTP/1.0 clients).
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/vnd.api+json
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # -----------------------------------------------------------------
    #  Upload / body limits
    # -----------------------------------------------------------------
    client_max_body_size 8m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # -----------------------------------------------------------------
    #  Timeouts
    # -----------------------------------------------------------------
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # -----------------------------------------------------------------
    #  Rate limiting — a very conservative global limit; login endpoint
    #  gets a stricter zone in the vhost.
    # -----------------------------------------------------------------
    limit_req_zone   $binary_remote_addr zone=global:10m rate=60r/s;
    # 30r/m + burst leaves headroom for CI verification scripts that exercise
    # login/forgot/reset while still blocking credential-stuffing bursts.
    limit_req_zone   $binary_remote_addr zone=login:10m  rate=30r/m;
    limit_req_status 429;
    limit_conn_zone  $binary_remote_addr zone=perip:10m;

    # -----------------------------------------------------------------
    #  Access log — combined format extended with request time + upstream.
    # -----------------------------------------------------------------
    log_format portal '$remote_addr - $remote_user [$time_iso8601] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'urt=$upstream_response_time';
    access_log /dev/stdout portal;

    # -----------------------------------------------------------------
    #  Include vhost(s)
    # -----------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
