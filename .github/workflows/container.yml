name: container-build

on:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/docker/**"
      - "infrastructure/nginx/**"
      - "compose.yaml"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/docker/**"
      - "infrastructure/nginx/**"
      - "compose.yaml"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use ghcr.io/<owner>/<repo>-<component> as the image name.  The GHCR
  # scope is inferred automatically from the workflow context.
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/portal-backend
  FRONTEND_IMAGE: ${{ github.repository }}/portal-frontend

jobs:
  compose-validate:
    name: compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load example env
        run: cp .env.example .env

      - name: compose.yaml
        run: docker compose -f compose.yaml --env-file .env config -q

      - name: compose.yaml + observability
        run: docker compose -f compose.yaml -f compose.observability.yaml --env-file .env config -q

  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: compose-validate
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            name-env: BACKEND_IMAGE
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            name-env: FRONTEND_IMAGE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/portal-${{ matrix.image }}:pr-${{ github.event.pull_request.number || 'main' }}
            portal-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
        with:
          image-ref: portal-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
        continue-on-error: true

      - name: Trivy scan (HIGH — informational)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: portal-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: table
